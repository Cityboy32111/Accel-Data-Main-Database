# Supabase CLI project configuration for Accel Case Intelligence.
# Remote project: jsfdewizzkyvbqziniou (accel-case-intelligence, us-west-1).
# Migrations are applied with `npm run db:migrate` (Management API) because the
# cloud development environment has no direct Postgres network path; the script
# records each migration in supabase_migrations.schema_migrations so the CLI's
# `supabase db push` and `supabase migration list` stay consistent.
project_id = "accel-case-intelligence"

[db]
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[auth]
enabled = true
site_url = "http://localhost:3000"
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "100MiB"
